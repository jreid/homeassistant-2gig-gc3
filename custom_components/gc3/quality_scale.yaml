rules:
  # --- Bronze -------------------------------------------------------------
  action-setup:
    status: exempt
    comment: |
      No custom actions. Arm/disarm are the standard alarm_control_panel
      services, registered by that platform.
  appropriate-polling: done
  brands:
    status: todo
    comment: Logo/icon still to be submitted to home-assistant/brands.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: done
    comment: |
      pygc3 is pinned in manifest requirements, built from source in this repo
      and published to PyPI from a tagged commit.
  docs-actions:
    status: exempt
    comment: See action-setup; the standard alarm services need no extra docs.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: |
      Polling only. The panel's SSE endpoint accepts subscribers but is a stub:
      it emits a 14-byte banner on connect and never pushes an event, verified
      across a full arm cycle (INTEGRATION_PLAN.md §6). There is nothing to
      subscribe to.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: |
      Keyed on host. GET /status returns only armState and isArmedStay -- the
      panel exposes no serial or other identity to key on (§1).

  # --- Silver -------------------------------------------------------------
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      Handled by DataUpdateCoordinator, which logs the failure once and the
      recovery once. Relevant here because the panel refuses API connections for
      roughly a minute after it reboots.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # --- Gold ---------------------------------------------------------------
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: |
      The panel advertises nothing to discover. Probed 2026-08-02 with
      tools/mdns_probe.py three independent ways -- a passive sniff of
      224.0.0.251:5353, unicast mDNS queries aimed straight at the panel, and a
      full service-type enumeration -- and all three came back empty while the
      panel was demonstrably online (tcp/3000 open, live ARP entry). The capture
      itself was sound: 176 records from 26 service types resolved elsewhere on
      the same LAN in the same window, none from the panel, and avahi's cache
      holds no entry for it. The panel does not even answer a direct unicast
      query, which most mDNS responders do. Caveat on record: the probe covered
      steady state, not a boot-time announcement burst, so a panel that
      announces only on network join and then stays silent for the record TTL
      would not have been seen. Re-run `tools/mdns_probe.py --seconds 300`
      across a power-cycle if that ever seems worth settling. Panel addresses
      are static in practice, so this is convenience, not function.
      See INTEGRATION_PLAN.md section 6.
  discovery-update-info:
    status: exempt
    comment: |
      Follows from discovery above: there is no discovery protocol to carry
      updated network information. The host is user-entered and changed through
      the reconfigure flow.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: |
      Zones added on the panel appear on the next poll. They are entities on the
      single panel device rather than devices of their own.
  entity-category:
    status: done
    comment: |
      The panel-health roll-ups (battery, tamper, supervision, bypass) are
      diagnostic. Zones, the open-zone count and the panel itself are primary.
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: Keyfob/pendant zones are created disabled.
  entity-translations:
    status: done
    comment: |
      The health and open-zone entities are translated. Zone names come from the
      panel's voiceDescriptor, which the user sets on the panel in their own
      language, so there is nothing to translate; the alarm entity takes the
      device name.
  exception-translations: done
  icon-translations:
    status: done
    comment: |
      Supervision, bypass and open-zone icons are in icons.json, including their
      on-state variants. The rest follow from device_class.
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: Raised when a zone stays in lossOfSupervision.
  stale-devices:
    status: done
    comment: |
      Zones removed on the panel have their entities removed from the registry
      on the next poll. The panel device itself is removed with the config entry.

  # --- Platinum -----------------------------------------------------------
  async-dependency: done
  inject-websession: done
  strict-typing: done

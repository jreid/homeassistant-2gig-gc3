name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Both validators track Home Assistant releases, so re-run weekly to catch
    # a rule that turned into an error without us touching the code.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          category: integration
          # No logo/icon submitted to home-assistant/brands yet.
          ignore: brands

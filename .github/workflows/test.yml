name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Home Assistant 2026.7+ requires Python >= 3.14.2.
  HA_PYTHON: "3.14"

jobs:
  pygc3:
    name: pygc3 (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pygc3
    strategy:
      fail-fast: false
      matrix:
        # The library supports more versions than the integration needs, since
        # it is published for anyone talking to a GC3.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test,dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest --cov=pygc3 --cov-report=term-missing

  integration:
    name: custom_components/gc3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.HA_PYTHON }}
      - name: Install test dependencies
        run: |
          pip install -r requirements-test.txt
          pip install ./pygc3
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: mypy custom_components/gc3
      - run: pytest --cov=custom_components/gc3 --cov-report=term-missing

  build:
    name: Build pygc3 distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.HA_PYTHON }}
      - run: pip install build twine
      - name: Build and check
        working-directory: pygc3
        run: |
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pygc3-dist
          path: pygc3/dist/*
